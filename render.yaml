services:
  - type: web
    name: ai-mystery-room
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
